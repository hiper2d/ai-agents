name: Publish

# Tag-triggered: `git tag v0.1.1 && git push origin v0.1.1`. The tag must equal the
# version in package.json; the job refuses otherwise so a mistagged release can't ship.
# Publishing uses npm Trusted Publishing (OIDC from this repo's workflow) — no token
# secret. Configure it once on npmjs.com → package → Settings → Trusted Publishing:
# GitHub Actions, repository hiper2d/ai-agents, workflow publish.yml.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      # Node 24 bundles an npm with working Trusted Publishing (>= 11.5.1). Deliberately
      # NO registry-url: setup-node would write an .npmrc with an empty
      # _authToken=${NODE_AUTH_TOKEN} + legacy always-auth, and that auth contamination
      # makes npm skip the OIDC token exchange and PUT unauthenticated — the registry
      # masks it as E404 "not found or you do not have permission" (v0.1.3 attempts #5-6).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm --version
      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish (skipped if this version is already on npm)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published — nothing to do."
            exit 0
          fi
          npm publish --provenance --access public
