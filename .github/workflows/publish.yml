name: Publish

# Tag-triggered: `git tag v0.1.1 && git push origin v0.1.1`. The tag must equal the
# version in package.json; the job refuses otherwise so a mistagged release can't ship.
# Publishing uses npm Trusted Publishing (OIDC from this repo's workflow) — no token
# secret. Configure it once on npmjs.com → package → Settings → Trusted Publishing:
# GitHub Actions, repository hiper2d/ai-agents, workflow publish.yml.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest && npm --version
      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish (skipped if this version is already on npm)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published — nothing to do."
            exit 0
          fi
          npm publish --provenance --access public
